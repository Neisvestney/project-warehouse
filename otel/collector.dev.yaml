receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # бэкенд
      http:
        endpoint: 0.0.0.0:4318   # прокси-эндпоинт фронтенда

processors:
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/health"'
        - 'IsMatch(attributes["url.path"], "^/api/telemetry/")'
    logs:
      log_record:
        - 'attributes["url.path"] == "/health"'
        - 'IsMatch(attributes["url.path"], "^/api/telemetry/")'
    metrics:
      datapoint:
        - 'attributes["server.port"] == 4317'
        - 'attributes["server.port"] == 4318'
        - 'attributes["http.route"] == "/health"'
        - 'IsMatch(attributes["http.route"], "^/?api/telemetry/")'
  batch:
    timeout: 1s

exporters:
  otlp:
    endpoint: aspire-dashboard:18889
    tls: {insecure: true}

service:
  pipelines:
    traces: {receivers: [otlp], processors: [filter/noise, batch], exporters: [otlp]}
    logs: {receivers: [otlp], processors: [filter/noise, batch], exporters: [otlp]}
    metrics: {receivers: [otlp], processors: [filter/noise, batch], exporters: [otlp]}
  telemetry:
    logs:
      level: warn
