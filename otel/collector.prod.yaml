receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # бэкенд
      http:
        endpoint: 0.0.0.0:4318   # прокси-эндпоинт фронтенда

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/health"'
        - 'IsMatch(attributes["url.path"], "^/api/telemetry/")'
    logs:
      log_record:
        - 'attributes["url.path"] == "/health"'
        - 'IsMatch(attributes["url.path"], "^/api/telemetry/")'
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  file/traces:
    path: /telemetry/traces.json
    format: json
    rotation: {max_megabytes: 64, max_days: 14, max_backups: 20, localtime: true}
  file/logs:
    path: /telemetry/logs.json
    format: json
    rotation: {max_megabytes: 64, max_days: 14, max_backups: 20, localtime: true}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/noise, batch]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/noise, batch]
      exporters: [file/logs]
  telemetry:
    logs:
      level: warn
