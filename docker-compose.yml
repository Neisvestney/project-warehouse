services:
  postgres:
    image: postgres:17
    command: postgres -c max_connections=400
    environment:
      POSTGRES_DB: projectwarehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projectwarehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  projectwarehouse.server:
    image: projectwarehouse.server
    build:
      context: .
      dockerfile: ProjectWarehouse.Server/Dockerfile
    ports:
      - "4587:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=projectwarehouse;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=200
      - Jwt__SecretKey=${Jwt__SecretKey}
      - Seed__AdminPassword=${Seed__AdminPassword}
    volumes:
      # Losing these makes every stored marketplace Api-Key undecryptable — back up alongside the DB.
      - ./ProjectWarehouse.Server/keys:/keys
      # Not self-contained: without a DB dump the file names on disk map to nothing.
      - ./ProjectWarehouse.Server/.localdata:/data
    depends_on:
      postgres:
        condition: service_healthy

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    profiles: ["telemetry"]
    ports:
      - "18888:18888"
    environment:
      - DASHBOARD__OTLP__AUTHMODE=Unsecured
      - DASHBOARD__FRONTEND__AUTHMODE=Unsecured

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    profiles: ["telemetry"]
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      # dotnet run lives on the host, not in the network — it can only reach the collector via localhost
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/collector.dev.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - aspire-dashboard

volumes:
  postgres_data:
